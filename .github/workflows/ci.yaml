name: Restaurant Company - CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ==========================================================
  # PARALLEL JOB #1 - LINT
  # ==========================================================
  lint:
    name: "1. LINT - Parallel"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint


  # ==========================================================
  # PARALLEL JOB #2 - SONARQUBE
  # ==========================================================
  sonarqube:
    name: "2. SONARQUBE - Parallel"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Code Analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  # ==========================================================
  # PARALLEL JOB #3 - TRIVY SOURCE CODE SCAN
  # ==========================================================
  trivy:
    name: "3. TRIVY SOURCE SCAN - Parallel"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0


  # ==========================================================
  # BUILD JOB
  # WAITS UNTIL ALL QUALITY CHECKS PASS
  # ==========================================================
  build:
    name: "4. BUILD - After Quality Checks"
    runs-on: ubuntu-latest

    needs:
      - lint
      - sonarqube
      - trivy

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Verify Build
        run: |
          echo "Build completed successfully"
          ls -lah dist/


  # ==========================================================
  # DOCKER JOB
  # BUILDS, SCANS, AND TESTS THE CONTAINER
  # ==========================================================
  docker:
    name: "5. DOCKER - Build, Scan and Test"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t restaurant-company:${{ github.sha }} .

      - name: Show Docker Image
        run: docker images restaurant-company

      # Scan the Docker image for vulnerabilities
      - name: Trivy Docker Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: restaurant-company:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

      # Start the application container
      - name: Start Restaurant Container
        run: |
          docker run -d \
            --name restaurant-company \
            -p 8080:80 \
            restaurant-company:${{ github.sha }}

      - name: Wait for Application
        run: sleep 5

      # Smoke test
      - name: Smoke Test
        run: |
          curl --fail http://localhost:8080/


  # ==========================================================
  # PUSH TO AWS ECR
  # ONLY AFTER DOCKER BUILD, SCAN AND TEST PASS
  # ==========================================================
  push-to-ecr:
    name: "6. PUSH TO AWS ECR"
    runs-on: ubuntu-latest
    needs: docker

    # Don't push images when a Pull Request is created
    # Only push after a commit to main
    if: github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image for ECR
        run: |
          docker build \
            -t restaurant-company:${{ github.sha }} .

      # Authenticate GitHub Actions with AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tag image with commit SHA and latest
      - name: Tag Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag restaurant-company:${IMAGE_TAG} \
            ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

          docker tag restaurant-company:${IMAGE_TAG} \
            ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest

      # Push both tags to ECR
      - name: Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest


  # ==========================================================
  # FINAL SUCCESS JOB
  # ==========================================================
  success:
    name: "7. CI PIPELINE PASSED"
    runs-on: ubuntu-latest
    needs: push-to-ecr

    steps:
      - name: Pipeline Success
        run: |
          echo "=========================================="
          echo "RESTAURANT COMPANY CI PIPELINE PASSED"
          echo "=========================================="
          echo "1. Lint passed"
          echo "2. SonarQube analysis passed"
          echo "3. Trivy source scan completed"
          echo "4. Application build passed"
          echo "5. Docker image tested"
          echo "6. Docker image pushed to AWS ECR"
          echo "=========================================="
